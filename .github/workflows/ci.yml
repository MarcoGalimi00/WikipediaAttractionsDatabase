name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Controllo sintassi degli script
        run: python -m py_compile *.py tools/*.py
      - name: Controllo di config.toml
        run: python -c "import config; assert len(config.CITIES) > 0"
