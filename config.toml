[http]
# Wikimedia e Overpass chiedono che ogni script si identifichi con un contatto.
# Metti l'URL del tuo repo (o un contatto tuo): finisce nello User-Agent di tutte le richieste.
contact = "https://github.com/OWNER/WikipediaAttractionsDatabase"

[servizi]
wikidata_api = "https://www.wikidata.org/w/api.php"
overpass_url = "https://overpass-api.de/api/interpreter"  # cambia per usare un mirror pubblico
qrank_base = "https://qrank.toolforge.org/download/"

[wikidata]
# Tipi Wikidata che contano come "luogo abitato" (confronto sul tipo esatto, senza sottotipi).
place_types = ["Q15284", "Q1549591", "Q486972", "Q515"]
# Vantaggio minimo (in numero di lingue) della prima candidata sulla rivale perché la scelta sia 'ok'.
min_ratio = 2.0

# Paesi senza codice ISO sulla propria voce Wikidata: QID del paese = codice ISO.
[wikidata.known_countries]
Q55 = "NL"
